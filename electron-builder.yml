appId: dev.cortex.app
productName: Cortex
copyright: Cortex
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - scripts/jira-mock/*.mjs
  - build/icon.png
  - package.json
# Renderer deps are bundled by vite (devDependencies), so only cross-spawn and zod ship in node_modules.
asar: true
# child processes can't execute files inside app.asar; the jira-mock is run via ELECTRON_RUN_AS_NODE
# (see src/main/services/config.ts, unpackedAsar). jira-mock imports seed.mjs, so both ship.
asarUnpack:
  - scripts/jira-mock/*.mjs
# Signing is picked up from the environment when present (CSC_LINK / CSC_KEY_PASSWORD on Windows and
# macOS, APPLE_* for notarization) and skipped otherwise. See docs/RELEASING.md.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]

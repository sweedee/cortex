name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, format, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Plain `npm ci` crashes on the npm version bundled with Node ("reading 'edgesOut'"),
      # so the install goes through the pinned npm 11 (see README).
      - name: Install dependencies
        run: npx npm@11.21.2 ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
